<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aigentless Tour Builder — Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --navy: #0D184C;
    --navy-soft: #24327a;
    --bg: #F8FCFF;
    --tint: #e9f1fa;
    --card: #ffffff;
    --border: #dfe6ef;
    --text: #1c2333;
    --muted: #5f6b7f;
    --accent: #3B63DD;
    --danger: #d93025;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--tint);
    color: var(--text);
    font-size: 14px;
  }
  input, textarea, select, button { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--bg);
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--navy);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif; font-size: 20px; font-weight: 700;
    flex-shrink: 0;
  }
  .doc-title {
    font-size: 18px; font-weight: 500; border: 1px solid transparent;
    padding: 2px 6px; border-radius: 4px; background: transparent;
    max-width: 320px;
  }
  .doc-title:hover { border-color: var(--border); }
  .doc-title:focus { outline: 2px solid var(--navy); border-radius: 4px; }
  .save-status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: #444; font-size: 17px; position: relative;
  }
  .icon-btn:hover { background: rgba(13,24,76,0.08); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:hover { background: none; }
  .icon-btn[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; font-size: 11px; padding: 4px 8px;
    border-radius: 4px; white-space: nowrap; z-index: 99;
  }
  .publish-btn {
    background: var(--navy); color: #fff; font-weight: 600;
    padding: 9px 22px; border-radius: 8px; font-size: 14px;
  }
  .publish-btn:hover { background: var(--navy-soft); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #3B63DD, #0D184C);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }

  /* ---------- Tabs ---------- */
  .tabs-row {
    background: var(--bg); display: flex; justify-content: center; gap: 4px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 55px; z-index: 40;
  }
  .tab {
    padding: 12px 18px 10px; font-size: 14px; color: var(--muted);
    border-bottom: 3px solid transparent; font-weight: 500;
  }
  .tab:hover { color: var(--navy); background: rgba(13,24,76,0.04); }
  .tab.active { color: var(--navy); border-bottom-color: var(--navy); }
  .tab .badge {
    background: var(--navy); color: #fff; border-radius: 10px;
    font-size: 11px; padding: 1px 7px; margin-left: 6px;
  }

  /* ---------- Language chips ---------- */
  .lang-row {
    display: flex; justify-content: center; gap: 8px; padding: 12px 0 0;
  }
  .chip {
    border: 1px solid var(--border); background: #fff; border-radius: 18px;
    padding: 6px 16px; font-size: 13px; color: var(--muted);
  }
  .chip:hover { border-color: var(--navy); color: var(--navy); }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip.dashed { border-style: dashed; }

  /* ---------- Canvas ---------- */
  .canvas { max-width: 770px; margin: 0 auto; padding: 14px 16px 120px; position: relative; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 14px; position: relative;
  }
  .header-card { border-top: 10px solid var(--navy); }
  .header-card .card-body { padding: 22px 26px; }
  .tour-title-input {
    width: 100%; border: none; border-bottom: 1px solid transparent;
    font-size: 30px; font-family: Georgia, serif; color: var(--navy); font-weight: 600;
    padding: 4px 0;
  }
  .tour-title-input:focus, .tour-desc-input:focus { outline: none; border-bottom: 2px solid var(--navy); }
  .tour-desc-input {
    width: 100%; border: none; border-bottom: 1px solid transparent;
    font-size: 14px; color: var(--muted); padding: 6px 0; resize: none;
  }
  .meta-ids { margin-top: 12px; font-size: 11px; color: #9aa5b5; }

  .step-card { transition: box-shadow .15s; }
  .step-card.selected {
    border-left: 6px solid var(--accent);
    box-shadow: 0 2px 10px rgba(13,24,76,0.12);
  }
  .step-card.drag-over { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .step-card.dragging { opacity: 0.45; }

  .drag-handle {
    display: flex; justify-content: center; padding: 4px 0 0;
    color: #b6bfcc; cursor: grab; font-size: 13px; letter-spacing: 3px;
    user-select: none; height: 18px; line-height: 10px;
  }
  .drag-handle:hover { color: var(--navy); }

  .card-body { padding: 6px 24px 8px; }
  .step-top-row { display: flex; gap: 14px; align-items: flex-start; }
  .step-title-input {
    flex: 1; border: none; background: #f4f7fb; border-bottom: 1px solid var(--border);
    font-size: 16px; padding: 12px 14px; border-radius: 4px 4px 0 0;
  }
  .step-title-input:focus { outline: none; border-bottom: 2px solid var(--navy); background: #eef3fa; }
  .type-select {
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    background: #fff; min-width: 168px; font-size: 14px;
  }
  .step-num {
    font-size: 12px; color: var(--muted); font-weight: 600; margin: 10px 0 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .pill {
    font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 600;
  }
  .pill.access { background: #e5edff; color: #2743a6; }
  .pill.stop { background: #e3f4e8; color: #1c7a3d; }
  .pill.wayfinding { background: #fff2dd; color: #a05c00; }
  .pill.feedback { background: #fbe7f1; color: #a12868; }

  /* ---------- Blocks ---------- */
  .block {
    border: 1px solid transparent; border-radius: 8px; padding: 10px 12px;
    margin: 6px 0; position: relative;
  }
  .block:hover { border-color: var(--border); background: #fafcff; }
  .block.block-dragging { opacity: .4; }
  .block.block-over { outline: 2px dashed var(--accent); }
  .block-tools {
    position: absolute; right: 8px; top: 6px; display: none; gap: 2px;
    background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1px;
  }
  .block:hover .block-tools { display: flex; }
  .block-tools button { padding: 4px 7px; border-radius: 4px; color: var(--muted); font-size: 13px; }
  .block-tools button:hover { background: var(--tint); color: var(--navy); }
  .block-grip { cursor: grab; }
  .rt-heading {
    width: 100%; border: none; font-size: 17px; font-weight: 700; color: var(--navy);
    background: transparent; padding: 2px 0;
  }
  .rt-body {
    width: 100%; border: none; font-size: 13.5px; color: var(--text);
    background: transparent; resize: none; padding: 2px 0; line-height: 1.5;
  }
  .rt-heading:focus, .rt-body:focus, .code-label:focus { outline: none; background: #eef3fa; border-radius: 4px; }
  .img-block {
    background: linear-gradient(135deg, #dfe8f5, #c8d6ea); border-radius: 8px;
    height: 150px; display: flex; align-items: center; justify-content: center;
    color: #7c8aa5; flex-direction: column; gap: 6px; font-size: 13px;
  }
  .img-block .ph-icon { font-size: 30px; }
  .code-block {
    background: var(--navy); color: #fff; border-radius: 8px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .code-label { background: transparent; border: none; color: #fff; font-weight: 600; width: 60%; }
  .code-label:focus { background: rgba(255,255,255,.12); color: #fff; }
  .code-value { font-family: monospace; letter-spacing: 4px; font-size: 18px; }
  .instr-list { padding-left: 20px; font-size: 13.5px; line-height: 1.9; }
  .instr-list input {
    border: none; background: transparent; width: 92%; padding: 1px 4px;
  }
  .instr-list input:focus { outline: none; background: #eef3fa; border-radius: 3px; }

  /* ---------- New block types & collapse ---------- */
  .block-type-tag {
    position: absolute; left: 12px; top: -7px; font-size: 10px; font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase; color: #9aa5b5; background: #fff;
    padding: 0 6px; border-radius: 4px; opacity: 0; transition: opacity .12s;
  }
  .block:hover .block-type-tag { opacity: 1; }
  .hl-list { list-style: none; padding-left: 4px; }
  .hl-list li::before { content: "✨ "; }
  .instr-list li { position: relative; }
  .row-x {
    color: #b6bfcc; font-size: 15px; padding: 0 6px; border-radius: 4px; vertical-align: middle;
  }
  .row-x:hover { color: var(--danger); background: #fdecea; }
  .cmp-table { margin-top: 4px; }
  .cmp-row { display: grid; grid-template-columns: 1fr 1fr 28px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .cmp-row input, .cmp-row select {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; background: #fff;
  }
  .cmp-row input:focus { outline: none; border-color: var(--navy); }
  .cmp-head input, .cmp-head select { font-weight: 700; color: var(--navy); background: #f4f7fb; }
  .dyn-block { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; }
  .dyn-badge {
    display: inline-block; background: #eef3ff; color: var(--accent); font-size: 11px;
    font-weight: 700; padding: 3px 10px; border-radius: 10px;
  }
  .ph-label-input {
    border: none; background: rgba(255,255,255,.75); border-radius: 6px; padding: 6px 10px;
    font-size: 12px; width: 75%; text-align: center;
  }
  .ph-label-input.dark { background: rgba(255,255,255,.12); color: #dbe4ff; }
  .ph-label-input.dark::placeholder { color: #93a5d8; }
  .ph-label-input:focus { outline: 2px solid var(--navy); }
  .collapsed-body { padding: 10px 24px 14px; cursor: pointer; }
  .collapsed-body .step-num { margin: 4px 0 2px; }
  .collapsed-title { font-size: 16px; font-weight: 600; color: var(--navy); }
  .ghost-text { color: #9aa5b5; font-weight: 400; }
  .collapsed-count { font-size: 11px; color: #9aa5b5; }
  .collapse-chevron { margin-left: auto; color: #9aa5b5; font-size: 13px; }
  .collapse-btn {
    font-size: 12px; color: var(--muted); padding: 3px 10px; border-radius: 12px;
  }
  .collapse-btn:hover { background: var(--tint); color: var(--navy); }
  .add-block-wrap { position: relative; margin: 10px 0 6px; }
  .add-block-btn {
    border: 1px dashed var(--border); border-radius: 8px; width: 100%; padding: 10px;
    color: var(--muted); font-size: 13px; font-weight: 600; background: #fbfdff;
  }
  .add-block-btn:hover { border-color: var(--navy); color: var(--navy); background: var(--tint); }
  .block-menu {
    position: absolute; left: 0; bottom: 44px; background: #fff; border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 6px 20px rgba(13,24,76,.18); padding: 6px; z-index: 60;
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 380px; max-width: 90%;
  }
  .block-menu button {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px;
    font-size: 13px; text-align: left; color: var(--text);
  }
  .block-menu button:hover { background: var(--tint); color: var(--navy); }
  .bm-icon { width: 20px; text-align: center; }
  .pv-highlight ul { list-style: none; padding-left: 2px; font-size: 13.5px; line-height: 1.9; }
  .pv-cmp { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .pv-cmp-row { display: grid; grid-template-columns: 1fr 1fr; }
  .pv-cmp-row span { padding: 8px 12px; font-size: 12.5px; border-bottom: 1px solid #eef2f7; }
  .pv-cmp-row span:first-child { border-right: 1px solid #eef2f7; }
  .pv-cmp-head span { background: var(--navy); color: #fff; font-weight: 700; font-size: 12px; }

  /* ---------- Audio row ---------- */
  .audio-row {
    display: flex; align-items: center; gap: 10px; margin: 10px 0 4px;
    background: #f4f7fb; border-radius: 22px; padding: 6px 14px 6px 6px;
  }
  .play-btn {
    width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0;
  }
  .audio-track { flex: 1; height: 4px; background: #ccd6e4; border-radius: 2px; position: relative; overflow: hidden; }
  .audio-progress { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); width: 0%; transition: width .2s linear; }
  .audio-time { font-size: 12px; color: var(--muted); font-family: monospace; }
  .audio-meta { font-size: 11px; color: #9aa5b5; white-space: nowrap; }

  /* ---------- Card footer ---------- */
  .card-footer {
    border-top: 1px solid var(--border); padding: 8px 16px;
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  }
  .footer-divider { width: 1px; height: 24px; background: var(--border); margin: 0 10px; }
  .toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .switch {
    width: 34px; height: 18px; border-radius: 10px; background: #c3cddb; position: relative;
    transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; top: 2px; left: 2px; transition: left .15s;
  }
  .switch.on { background: var(--navy); }
  .switch.on::after { left: 18px; }
  .feedback-select { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; background:#fff; }
  .floor-input {
    width: 52px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
    font-size: 12px; text-align: center;
  }

  /* ---------- Floating toolbar ---------- */
  .side-toolbar {
    position: absolute; right: -62px; width: 48px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; padding: 6px 0;
    box-shadow: 0 2px 8px rgba(13,24,76,0.10);
    z-index: 30;
  }
  .side-toolbar button {
    width: 36px; height: 36px; border-radius: 50%; margin: 2px 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--navy); font-size: 17px; position: relative;
  }
  .side-toolbar button:hover { background: var(--tint); }
  .side-toolbar button[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; right: 46px; top: 50%; transform: translateY(-50%);
    background: #333; color: #fff; font-size: 11px; padding: 4px 8px;
    border-radius: 4px; white-space: nowrap;
  }
  @media (max-width: 940px) { .side-toolbar { right: 4px; flex-direction: row; width: auto; padding: 0 6px; position: fixed; bottom: 16px; top: auto !important; } .side-toolbar button[data-tip]:hover::after { display: none; } }

  /* ---------- Preview tab ---------- */
  .preview-wrap { display: flex; justify-content: center; padding: 24px 16px 80px; gap: 28px; flex-wrap: wrap; }
  .phone {
    width: 375px; border-radius: 34px; border: 10px solid #10152e;
    background: var(--bg); overflow: hidden; box-shadow: 0 14px 40px rgba(13,24,76,0.25);
    height: 720px; display: flex; flex-direction: column;
  }
  .phone-head {
    background: var(--navy); color: #fff; padding: 14px 18px 12px;
  }
  .phone-head .ph-prop { font-family: Georgia, serif; font-size: 17px; }
  .phone-head .ph-step { font-size: 12px; opacity: .75; margin-top: 2px; }
  .phone-body { flex: 1; overflow-y: auto; padding: 16px; }
  .pv-block { margin-bottom: 14px; }
  .pv-h { font-size: 19px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .pv-p { font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .pv-img { height: 140px; border-radius: 10px; background: linear-gradient(135deg,#dfe8f5,#c8d6ea); display:flex; align-items:center; justify-content:center; color:#7c8aa5; font-size:26px; }
  .pv-code { background: var(--navy); color:#fff; border-radius: 10px; padding: 14px; text-align:center; }
  .pv-code .cv { font-family: monospace; font-size: 24px; letter-spacing: 6px; margin-top: 4px; }
  .pv-instr { font-size: 13.5px; line-height: 1.9; padding-left: 18px; }
  .phone-foot { display: flex; border-top: 1px solid var(--border); }
  .phone-foot button { flex: 1; padding: 14px; font-weight: 600; color: var(--navy); font-size: 14px; }
  .phone-foot button:first-child { border-right: 1px solid var(--border); }
  .phone-foot button:hover { background: var(--tint); }
  .pv-audio { display:flex; align-items:center; gap:10px; background:#eef3fa; border-radius:20px; padding:8px 12px; margin-bottom:14px; }
  .pv-feedback { border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .pv-feedback .stars { font-size: 22px; color:#c9b458; letter-spacing: 4px; margin-top:6px; cursor: pointer; }
  .preview-note { max-width: 300px; font-size: 13px; color: var(--muted); line-height: 1.6; padding-top: 12px; }
  .preview-note h3 { color: var(--navy); font-size: 15px; margin-bottom: 8px; }

  /* ---------- Settings tab ---------- */
  .settings-wrap { max-width: 770px; margin: 0 auto; padding: 20px 16px 80px; }
  .settings-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding: 20px 24px; margin-bottom: 14px; }
  .settings-card h3 { color: var(--navy); font-size: 16px; margin-bottom: 4px; }
  .settings-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .settings-row { display:flex; align-items:center; justify-content:space-between; padding: 10px 0; border-top: 1px solid #eef2f7; }
  .settings-row:first-of-type { border-top: none; }
  .ghost-btn {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 16px; font-size: 13px;
    color: var(--navy); font-weight: 600; background: #fff;
  }
  .ghost-btn:hover { border-color: var(--navy); background: var(--tint); }

  /* ---------- Image upload & itinerary (editor) ---------- */
  .img-real { position: relative; border-radius: 8px; overflow: hidden; cursor: pointer; }
  .img-real img { width: 100%; max-height: 260px; object-fit: cover; display: block; border-radius: 8px; }
  .img-replace-hint {
    position: absolute; bottom: 0; left: 0; right: 0; background: rgba(13,24,76,.65); color: #fff;
    font-size: 12px; text-align: center; padding: 6px; opacity: 0; transition: opacity .15s;
  }
  .img-real:hover .img-replace-hint { opacity: 1; }
  .itin-note { font-size: 11px; color: #9aa5b5; margin: 4px 0 8px; }
  .itin-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .itin-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px;
    border-bottom: 1px solid #eef2f7; color: var(--muted);
  }
  .itin-row:last-child { border-bottom: none; }
  .itin-row.here { background: var(--tint); color: var(--navy); font-weight: 600; }
  .itin-thumb {
    width: 22px; height: 22px; border-radius: 50%; background: #e4eaf3; color: var(--navy);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .itin-row.here .itin-thumb { background: var(--navy); color: #fff; }
  .itin-here { margin-left: auto; font-size: 11px; color: var(--accent); font-weight: 600; }
  .hl-item-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .hl-icon-select {
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 6px; font-size: 13px;
    background: #fff; width: 130px; flex-shrink: 0;
  }
  .hl-text-input {
    flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .hl-text-input:focus { outline: none; border-color: var(--navy); }
  .hl-img-btn {
    border: 1px dashed var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px;
    color: var(--muted); flex-shrink: 0;
  }
  .hl-img-btn:hover { border-color: var(--navy); color: var(--navy); }
  .hl-thumb {
    width: 34px; height: 34px; border-radius: 6px; object-fit: cover; cursor: pointer;
    border: 1px solid var(--border); flex-shrink: 0;
  }
  .pv-hl-list { margin-top: 6px; }
  .pv-hl-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }

<body>
<div class="demo-banner">DEMO MOCK — Aigentless Tour Builder redesign concept · <b>not connected to live data</b></div>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   Seed data — mirrors the current "Master Tour" for The House
   ============================================================ */
let _id = 100;
const uid = () => "id" + (_id++);

const rt = (heading, body) => ({ id: uid(), type: "richtext", heading: heading || "", body: body || "" });
const img = (caption) => ({ id: uid(), type: "image", caption: caption || "", src: "" });
const video = () => ({ id: uid(), type: "video", caption: "" });
const code = (label) => ({ id: uid(), type: "access_code", label: label || "", value: "4 8 2 9" });
const progress = (title) => ({ id: uid(), type: "progress", title: title || "" });
const hlItem = () => ({ text: "", icon: "✨ Sparkle", src: "" });
const highlight = (title) => ({ id: uid(), type: "highlight", title: title || "", items: [hlItem()] });
const HL_ICONS = ["✨ Sparkle","🍳 Kitchen","🏋️ Gym","🧘 Yoga","🏊 Pool","🛁 Bath","🛏 Bed","🏀 Basketball","🚲 Bike","🐾 Pet Friendly","📶 WiFi","🅿️ Parking","🌇 Balcony","🧺 Laundry","☕ Coffee","🏖 Beach","🌳 Outdoors","🔒 Secure","📦 Packages","⭐ Star"];
const iconOf = v => (v || "✨").split(" ")[0];
const comparison = () => ({ id: uid(), type: "comparison", colA: "", colB: "", rows: [["", ""]] });
const dyncomp = () => ({ id: uid(), type: "dyncomp", unitA: "", unitB: "" });
const mapBlock = () => ({ id: uid(), type: "map", label: "" });
const matterport = () => ({ id: uid(), type: "matterport", label: "" });

const BLOCK_TYPES = [
  { key: "richtext",   label: "Rich Text",          icon: "T",  make: () => rt("", "") },
  { key: "image",      label: "Image",              icon: "🖼️", make: () => img("") },
  { key: "video",      label: "Video",              icon: "▶️", make: () => video() },
  { key: "access_code",label: "Access Code",        icon: "🔑", make: () => code("") },
  { key: "progress",   label: "Progress List",      icon: "☑️", make: () => progress("") },
  { key: "highlight",  label: "Highlight List",     icon: "✨", make: () => highlight("") },
  { key: "comparison", label: "Comparison",         icon: "⚖️", make: () => comparison() },
  { key: "dyncomp",    label: "Dynamic Comparison", icon: "⚡", make: () => dyncomp() },
  { key: "map",        label: "Map",                icon: "🗺️", make: () => mapBlock() },
  { key: "matterport", label: "Matterport 3D",      icon: "🧊", make: () => matterport() },
];
const blockLabel = t => (BLOCK_TYPES.find(b => b.key === t) || {}).label || t;

/* Fresh, blank tour — one empty step card, like a new Google Form */
const seedSteps = [
  { id: uid(), title: "", floor: 0, type: "stop", feedback: "", audio: 0, blocks: [ rt("", "") ] },
];

const TYPE_META = {
  stop:       { label: "Stop",       icon: "📍" },
  access:     { label: "Access",     icon: "🔑" },
  wayfinding: { label: "Wayfinding", icon: "🧭" },
};
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const deep = o => JSON.parse(JSON.stringify(o));

/* ============================================================
   Blocks (edit mode)
   ============================================================ */
/* One highlight item row: icon picker + text + image upload */
function HighlightItemRow({ item, onChange, onRemove, canRemove }) {
  const fileRef = useRef(null);
  const onFile = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => onChange({ ...item, src: ev.target.result });
    reader.readAsDataURL(f);
    e.target.value = "";
  };
  return (
    <div className="hl-item-row">
      <select className="hl-icon-select" title="Icon" value={item.icon}
              onChange={e => onChange({ ...item, icon: e.target.value })}>
        {HL_ICONS.map(ic => <option key={ic} value={ic}>{ic}</option>)}
      </select>
      <input className="hl-text-input" placeholder='e.g. "You love to cook"' value={item.text}
             onChange={e => onChange({ ...item, text: e.target.value })}/>
      <input type="file" accept="image/*" ref={fileRef} style={{display:"none"}} onChange={onFile}/>
      {item.src ? (
        <img className="hl-thumb" src={item.src} alt="" title="Click to replace image"
             onClick={() => fileRef.current.click()}/>
      ) : (
        <button className="hl-img-btn" title="Add image" onClick={() => fileRef.current.click()}>🖼️＋</button>
      )}
      {canRemove && <button className="row-x" title="Remove" onClick={onRemove}>×</button>}
    </div>
  );
}

function BlockEditor({ block, onChange, onDelete, onDuplicate, dragProps, dragState, allSteps, stepIndex }) {
  const cls = "block" + (dragState === "dragging" ? " block-dragging" : dragState === "over" ? " block-over" : "");
  const set = patch => onChange({ ...block, ...patch });
  const fileRef = useRef(null);
  const pickImage = () => fileRef.current && fileRef.current.click();
  const onFile = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => set({ src: ev.target.result, caption: block.caption || f.name.replace(/\.[^.]+$/, "") });
    reader.readAsDataURL(f);
    e.target.value = "";
  };
  return (
    <div className={cls} {...dragProps.container}>
      <div className="block-tools">
        <button className="block-grip" title="Drag to reorder block" draggable {...dragProps.handle}>⠿</button>
        <button title="Duplicate block" onClick={onDuplicate}>⧉</button>
        <button title="Delete block" onClick={onDelete} style={{color:"var(--danger)"}}>🗑</button>
      </div>
      <div className="block-type-tag">{blockLabel(block.type)}</div>
      {block.type === "richtext" && (
        <div>
          <input className="rt-heading" placeholder="Heading" value={block.heading}
                 onChange={e => set({ heading: e.target.value })}/>
          <textarea className="rt-body" placeholder="Description" rows={Math.max(1, Math.ceil((block.body||"").length / 90))}
                    value={block.body} onChange={e => set({ body: e.target.value })}/>
        </div>
      )}
      {block.type === "image" && (
        <div>
          <input type="file" accept="image/*" ref={fileRef} style={{display:"none"}} onChange={onFile}/>
          {block.src ? (
            <div className="img-real" onClick={pickImage} title="Click to replace image">
              <img src={block.src} alt={block.caption}/>
              <div className="img-replace-hint">Click to replace</div>
            </div>
          ) : (
            <div className="img-block" onClick={pickImage} style={{cursor:"pointer"}}>
              <div className="ph-icon">🖼️</div>
              <div>Click to upload an image</div>
            </div>
          )}
        </div>
      )}
      {block.type === "video" && (
        <div className="img-block" style={{background:"linear-gradient(135deg,#1c2340,#0D184C)", color:"#9db4ff"}}>
          <div className="ph-icon">▶️</div>
          <div>{block.caption || "Click to add a video"}</div>
        </div>
      )}
      {block.type === "access_code" && (
        <div className="code-block">
          <input className="code-label" placeholder="Access code label" value={block.label} onChange={e => set({ label: e.target.value })}/>
          <span className="code-value">••••</span>
        </div>
      )}
      {block.type === "progress" && (
        <div>
          <input className="rt-heading" style={{fontSize:15}}
                 placeholder='e.g. "Next Level Living: Tour Itinerary"'
                 value={block.title} onChange={e => set({ title: e.target.value })}/>
          <div className="itin-note">☑️ Auto-populated from your Stop & Access steps (wayfinding excluded) — reorder steps to change the list</div>
          <div className="itin-list">
            {(allSteps || []).filter(s => s.type !== "wayfinding").map((s, i) => {
              const here = allSteps[stepIndex] && s.id === allSteps[stepIndex].id;
              return (
                <div className={"itin-row" + (here ? " here" : "")} key={s.id}>
                  <span className="itin-thumb">{here ? "●" : i}</span>
                  <span>{s.title || "Untitled step"}</span>
                  {here && <span className="itin-here">You are here</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}
      {block.type === "highlight" && (
        <div>
          <input className="rt-heading" style={{fontSize:15}}
                 placeholder='e.g. "The 24/7 Fitness Center offers…" or "You’ll love this unit if…"'
                 value={block.title} onChange={e => set({ title: e.target.value })}/>
          <div style={{marginTop:6}}>
            {block.items.map((it, i) => (
              <HighlightItemRow key={i} item={it} canRemove={block.items.length > 1}
                onChange={ni => { const items = block.items.slice(); items[i] = ni; set({ items }); }}
                onRemove={() => set({ items: block.items.filter((_, k) => k !== i) })}/>
            ))}
          </div>
          <button style={{color:"var(--accent)", fontSize:12, padding:"4px 0"}}
                  onClick={() => set({ items: [...block.items, hlItem()] })}>+ Add item</button>
        </div>
      )}
      {block.type === "comparison" && (
        <div className="cmp-table">
          <div className="cmp-row cmp-head">
            <input placeholder="Option A (e.g. Studio)" value={block.colA} onChange={e => set({ colA: e.target.value })}/>
            <input placeholder="Option B (e.g. 1-Bed)" value={block.colB} onChange={e => set({ colB: e.target.value })}/>
            <span/>
          </div>
          {block.rows.map((r, i) => (
            <div className="cmp-row" key={i}>
              <input placeholder="e.g. 480 sq ft" value={r[0]} onChange={e => {
                const rows = block.rows.map(x => x.slice()); rows[i][0] = e.target.value; set({ rows });
              }}/>
              <input placeholder="e.g. 710 sq ft" value={r[1]} onChange={e => {
                const rows = block.rows.map(x => x.slice()); rows[i][1] = e.target.value; set({ rows });
              }}/>
              <button className="row-x" title="Remove row" onClick={() => set({ rows: block.rows.filter((_, k) => k !== i) })}>×</button>
            </div>
          ))}
          <button style={{color:"var(--accent)", fontSize:12, padding:"6px 0 2px"}}
                  onClick={() => set({ rows: [...block.rows, ["", ""]] })}>+ Add row</button>
        </div>
      )}
      {block.type === "dyncomp" && (
        <div className="dyn-block">
          <div className="dyn-badge">⚡ Live — pulls current pricing & availability</div>
          <div className="cmp-row cmp-head" style={{marginTop:8}}>
            <select value={block.unitA} onChange={e => set({ unitA: e.target.value })}>
              <option value="">Select unit A…</option><option>Studio</option><option>1-Bed</option><option>2-Bed</option>
            </select>
            <select value={block.unitB} onChange={e => set({ unitB: e.target.value })}>
              <option value="">Select unit B…</option><option>Studio</option><option>1-Bed</option><option>2-Bed</option>
            </select>
            <span/>
          </div>
          <div style={{fontSize:12, color:"var(--muted)", marginTop:6}}>Rent, deposit, sq ft, and availability are compared automatically at tour time.</div>
        </div>
      )}
      {block.type === "map" && (
        <div className="img-block" style={{background:"repeating-linear-gradient(45deg,#e4eefb,#e4eefb 12px,#d5e4f6 12px,#d5e4f6 24px)"}}>
          <div className="ph-icon">🗺️</div>
          <input className="ph-label-input" placeholder="Map label (e.g. Route to fitness center)" value={block.label}
                 onChange={e => set({ label: e.target.value })} onClick={e => e.stopPropagation()}/>
        </div>
      )}
      {block.type === "matterport" && (
        <div className="img-block" style={{background:"linear-gradient(135deg,#101c3f,#233a7a)", color:"#9db4ff"}}>
          <div className="ph-icon">🧊</div>
          <input className="ph-label-input dark" placeholder="Matterport 3D walkthrough (paste link)" value={block.label}
                 onChange={e => set({ label: e.target.value })} onClick={e => e.stopPropagation()}/>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Audio row with fake playback
   ============================================================ */
function AudioRow({ seconds, onRegen }) {
  const [playing, setPlaying] = useState(false);
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!playing) return;
    const iv = setInterval(() => setT(x => {
      if (x + 0.2 >= seconds) { setPlaying(false); return 0; }
      return x + 0.2;
    }), 200);
    return () => clearInterval(iv);
  }, [playing, seconds]);
  return (
    <div className="audio-row">
      <button className="play-btn" onClick={() => setPlaying(p => !p)}>{playing ? "❚❚" : "▶"}</button>
      <div className="audio-track"><div className="audio-progress" style={{width: (t/seconds*100) + "%"}}/></div>
      <span className="audio-time">{fmt(Math.floor(playing ? t : seconds))}</span>
      <button className="icon-btn" data-tip="Regenerate audio" style={{width:30,height:30,fontSize:14}} onClick={onRegen}>🔄</button>
      <span className="audio-meta">Jul 08 · 13:43</span>
    </div>
  );
}

/* ============================================================
   Step card
   ============================================================ */
function StepCard({ step, index, selected, onSelect, onChange, onDup, onDelete, dnd, toast, cardRef, allSteps }) {
  const set = patch => onChange({ ...step, ...patch });
  const setBlocks = blocks => set({ blocks });

  // block-level drag
  const [blockDrag, setBlockDrag] = useState(null);
  const [blockOver, setBlockOver] = useState(null);
  const moveBlock = (from, to) => {
    if (from === to || from == null || to == null) return;
    const b = step.blocks.slice();
    const [m] = b.splice(from, 1);
    b.splice(to, 0, m);
    setBlocks(b);
  };

  const cls = "card step-card" + (selected ? " selected" : "") +
    (dnd.dragIndex === index ? " dragging" : "") + (dnd.overIndex === index && dnd.dragIndex !== index ? " drag-over" : "");

  return (
    <div ref={cardRef} className={cls} onClick={() => onSelect(step.id)}
         onDragOver={e => { e.preventDefault(); dnd.setOver(index); }}
         onDrop={e => { e.preventDefault(); dnd.drop(index); }}>
      <div className="drag-handle" title="Drag to reorder step" draggable
           onDragStart={e => { e.dataTransfer.effectAllowed = "move"; dnd.start(index); }}
           onDragEnd={dnd.end}>⠿⠿</div>
      {!selected ? (
        /* ---- Collapsed view: just the essentials ---- */
        <div className="card-body collapsed-body">
          <div className="step-num">
            STEP {index}
            <span className={"pill " + step.type}>{TYPE_META[step.type].icon} {TYPE_META[step.type].label}</span>
            <span className="collapsed-count">{step.blocks.length} block{step.blocks.length === 1 ? "" : "s"}</span>
            <span className="collapse-chevron">▾</span>
          </div>
          <div className="collapsed-title">{step.title || <span className="ghost-text">Untitled step</span>}</div>
        </div>
      ) : (
        <React.Fragment>
        <div className="card-body">
          <div className="step-num">
            STEP {index}
            <span className={"pill " + step.type}>{TYPE_META[step.type].icon} {TYPE_META[step.type].label}</span>
            <span style={{flex:1}}/>
            <button className="collapse-btn" title="Collapse step" onClick={e => { e.stopPropagation(); onSelect(null); }}>▴ Collapse</button>
          </div>
          <div className="step-top-row">
            <input className="step-title-input" value={step.title} placeholder="Untitled step"
                   onChange={e => set({ title: e.target.value })}/>
            <select className="type-select" value={step.type} onChange={e => set({ type: e.target.value })}>
              {Object.entries(TYPE_META).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
            </select>
          </div>

          <div style={{marginTop: 8}}>
            {step.blocks.map((b, bi) => (
              <BlockEditor key={b.id} block={b} allSteps={allSteps} stepIndex={index}
                dragState={blockDrag === bi ? "dragging" : blockOver === bi && blockDrag !== bi ? "over" : null}
                dragProps={{
                  handle: {
                    onDragStart: e => { e.stopPropagation(); e.dataTransfer.effectAllowed = "move"; setBlockDrag(bi); },
                    onDragEnd: () => { setBlockDrag(null); setBlockOver(null); },
                  },
                  container: {
                    onDragOver: e => { if (blockDrag != null) { e.preventDefault(); e.stopPropagation(); setBlockOver(bi); } },
                    onDrop: e => { if (blockDrag != null) { e.preventDefault(); e.stopPropagation(); moveBlock(blockDrag, bi); setBlockDrag(null); setBlockOver(null); } },
                  },
                }}
                onChange={nb => setBlocks(step.blocks.map(x => x.id === nb.id ? nb : x))}
                onDelete={() => setBlocks(step.blocks.filter(x => x.id !== b.id))}
                onDuplicate={() => {
                  const copy = deep(b); copy.id = uid();
                  const nb = step.blocks.slice(); nb.splice(bi + 1, 0, copy); setBlocks(nb);
                }}
              />
            ))}
          </div>

          <AddBlockMenu onAdd={make => setBlocks([...step.blocks, make()])}/>
        </div>

        <div className="card-footer">
          <button className="icon-btn" data-tip="Duplicate step" onClick={e => { e.stopPropagation(); onDup(); }}>⧉</button>
          <button className="icon-btn" data-tip="Delete step" style={{color:"var(--danger)"}}
                  onClick={e => { e.stopPropagation(); onDelete(); }}>🗑</button>
        </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ---- "+ Add block" dropdown with all block types ---- */
function AddBlockMenu({ onAdd }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [open]);
  return (
    <div className="add-block-wrap" ref={ref}>
      <button className="add-block-btn" onClick={e => { e.stopPropagation(); setOpen(o => !o); }}>
        ＋ Add block <span style={{fontSize:10}}>▾</span>
      </button>
      {open && (
        <div className="block-menu">
          {BLOCK_TYPES.map(bt => (
            <button key={bt.key} onClick={e => { e.stopPropagation(); onAdd(bt.make); setOpen(false); }}>
              <span className="bm-icon">{bt.icon}</span> {bt.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const [steps, setSteps] = useState(seedSteps);
  const [tab, setTab] = useState("build");
  const [lang, setLang] = useState("English");
  const [langs, setLangs] = useState(["English", "Español"]);
  const [tourTitle, setTourTitle] = useState("");
  const [tourDesc, setTourDesc] = useState("");
  const [selectedId, setSelectedId] = useState(seedSteps[0].id);
  const [toastMsg, setToastMsg] = useState(null);
  const [saved, setSaved] = useState(true);

  // undo / redo
  const history = useRef([deep(seedSteps)]);
  const hIndex = useRef(0);
  const commit = useCallback(next => {
    setSteps(next);
    history.current = history.current.slice(0, hIndex.current + 1);
    history.current.push(deep(next));
    hIndex.current++;
    setSaved(false);
    clearTimeout(commit._t);
    commit._t = setTimeout(() => setSaved(true), 900);
  }, []);
  const undo = () => { if (hIndex.current > 0) { hIndex.current--; setSteps(deep(history.current[hIndex.current])); } };
  const redo = () => { if (hIndex.current < history.current.length - 1) { hIndex.current++; setSteps(deep(history.current[hIndex.current])); } };
  useEffect(() => {
    const h = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const toast = msg => { setToastMsg(msg); clearTimeout(toast._t); toast._t = setTimeout(() => setToastMsg(null), 2600); };

  // step drag & drop
  const [dragIndex, setDragIndex] = useState(null);
  const [overIndex, setOverIndex] = useState(null);
  const dnd = {
    dragIndex, overIndex,
    start: i => setDragIndex(i),
    setOver: i => setOverIndex(i),
    end: () => { setDragIndex(null); setOverIndex(null); },
    drop: i => {
      if (dragIndex != null && dragIndex !== i) {
        const s = steps.slice(); const [m] = s.splice(dragIndex, 1); s.splice(i, 0, m);
        commit(s);
      }
      setDragIndex(null); setOverIndex(null);
    },
  };

  // floating toolbar position
  const canvasRef = useRef(null);
  const cardRefs = useRef({});
  const [toolbarTop, setToolbarTop] = useState(120);
  useEffect(() => {
    const el = cardRefs.current[selectedId];
    if (el && canvasRef.current) {
      setToolbarTop(el.offsetTop + 8);
    }
  }, [selectedId, steps, tab]);

  const selIdx = steps.findIndex(s => s.id === selectedId);
  const updateStep = ns => commit(steps.map(s => s.id === ns.id ? ns : s));

  const addStep = () => {
    const ns = { id: uid(), title: "", floor: 0, type: "stop", feedback: "", audio: 0,
      blocks: [rt("", "")] };
    const s = steps.slice(); s.splice((selIdx < 0 ? steps.length - 1 : selIdx) + 1, 0, ns);
    commit(s); setSelectedId(ns.id);
  };
  const addBlockToSelected = block => {
    if (selIdx < 0) return;
    const st = deep(steps[selIdx]); st.blocks.push(block);
    updateStep(st);
  };

  const buildings = ["12 North","140 S Clarkson","1515 Flats","1537 N Orleans","25 East","25Twenty","270 Lincoln","499 President","626 On The Park","Post Chicago"];
  const adminLinks = ["User Management","City Management","Device Management","Validation Dashboard","App Translations","Feature Flags","Release Notes"];

  return (
    <div className="admin-shell">
      {/* ===== Sidebar ===== */}
      <aside className="admin-side">
        <div className="brand-row">
          <AigentlessMark/>
          <span className="brand-name">Aigentless</span>
          <span className="env-badge">PRODUCTION</span>
        </div>
        <input className="side-search" placeholder="🔍 Search buildings (⌘+K)"/>
        {buildings.map(b => (
          <button key={b} className={"side-item" + (b === "Post Chicago" ? " active" : "")}>{b}</button>
        ))}
        <div className="side-divider"/>
        <button className="side-item admin">New Building ⊕</button>
        {adminLinks.map(l => <button key={l} className="side-item admin">{l}</button>)}
        <div className="side-label">Environment</div>
        <select className="env-select"><option>Production</option><option>Staging</option><option>Development</option></select>
        <div className="redacted-row"><input type="checkbox"/> Redacted Mode</div>
      </aside>

      {/* ===== Main ===== */}
      <main className="admin-main">
        <div className="prop-head">
          <div className="prop-name">Post Chicago</div>
          <div className="prop-tabs-row">
            {["Details","Amenities","Fees & Policies","Units","Floorplans","Tours","Access","Advanced"].map(t => (
              <button key={t} className={"prop-tab" + (t === "Tours" ? " active" : "")}>{t}</button>
            ))}
            <div className="prop-links">
              <span>Admin Analytics ↗</span>
              <span>Analytics Dashboard ↗</span>
              <span>⎋ Log out</span>
            </div>
          </div>
        </div>
        <div className="crumb-row">All Tours / <b>{tourTitle || "Untitled tour"}</b></div>

      {/* Top bar */}
      <div className="topbar">
        <AigentlessMark/>
        <input className="doc-title" value={tourTitle} placeholder="Untitled tour" readOnly
               style={{width: Math.max(tourTitle.length, 12) + 2 + "ch"}}/>
        <span className="save-status">{saved ? "✓ All changes saved" : "Saving…"}</span>
        <div className="topbar-spacer"/>
        <button className="icon-btn" data-tip="Theme" onClick={() => toast("Theme customizer — coming in v2")}>🎨</button>
        <button className="icon-btn" data-tip="Preview" onClick={() => setTab("preview")}>👁</button>
        <button className="icon-btn" data-tip="Undo (⌘Z)" onClick={undo} disabled={hIndex.current === 0}>↩</button>
        <button className="icon-btn" data-tip="Redo (⇧⌘Z)" onClick={redo} disabled={hIndex.current >= history.current.length - 1}>↪</button>
        <button className="icon-btn" data-tip="Copy tour link" onClick={() => toast("Tour link copied to clipboard")}>🔗</button>
        <button className="icon-btn" data-tip="Share with team" onClick={() => toast("Share dialog — invite teammates by email")}>👤+</button>
        <button className="publish-btn" onClick={() => toast("Tour published! Live for all prospects.")}>Publish</button>
        <div className="avatar">DH</div>
      </div>

      {/* Tabs */}
      <div className="tabs-row">
        <button className={"tab" + (tab === "build" ? " active" : "")} onClick={() => setTab("build")}>
          Steps<span className="badge">{steps.length}</span>
        </button>
        <button className={"tab" + (tab === "preview" ? " active" : "")} onClick={() => setTab("preview")}>Preview</button>
        <button className={"tab" + (tab === "settings" ? " active" : "")} onClick={() => setTab("settings")}>Settings</button>
      </div>

      {tab === "build" && (
        <div>
          <div className="lang-row">
            {langs.map(l => (
              <button key={l} className={"chip" + (lang === l ? " active" : "")} onClick={() => setLang(l)}>{l}</button>
            ))}
            <button className="chip dashed" onClick={() => setTab("settings")}>+ Add language</button>
            <button className="chip" onClick={() => toast("Resyncing all languages & audio…")}>🔄 Resync all</button>
          </div>

          <div className="canvas" ref={canvasRef}>
            {/* Header card */}
            <div className="card header-card">
              <div className="card-body">
                <input className="tour-title-input" placeholder="Untitled tour" value={tourTitle} onChange={e => setTourTitle(e.target.value)}/>
                <textarea className="tour-desc-input" rows="2" placeholder="Tour description" value={tourDesc} onChange={e => setTourDesc(e.target.value)}/>
              </div>
            </div>

            {/* Step cards */}
            {steps.map((s, i) => (
              <StepCard key={s.id} step={s} index={i} allSteps={steps}
                cardRef={el => cardRefs.current[s.id] = el}
                selected={s.id === selectedId}
                onSelect={setSelectedId}
                onChange={updateStep}
                onDup={() => {
                  const copy = deep(s); copy.id = uid(); copy.title = s.title + " (copy)";
                  copy.blocks.forEach(b => b.id = uid());
                  const arr = steps.slice(); arr.splice(i + 1, 0, copy); commit(arr); setSelectedId(copy.id);
                }}
                onDelete={() => { commit(steps.filter(x => x.id !== s.id)); toast("Step deleted — ⌘Z to undo"); }}
                dnd={dnd} toast={toast}
              />
            ))}

            {/* Floating toolbar */}
            <div className="side-toolbar" style={{top: toolbarTop}}>
              <button data-tip="Add step" onClick={addStep}>⊕</button>
              <button data-tip="Duplicate selected step" onClick={() => {
                if (selIdx < 0) return;
                const s = steps[selIdx];
                const copy = deep(s); copy.id = uid(); copy.blocks.forEach(b => b.id = uid());
                const arr = steps.slice(); arr.splice(selIdx + 1, 0, copy); commit(arr); setSelectedId(copy.id);
              }}>⧉</button>
              <button data-tip="Collapse all" onClick={() => setSelectedId(null)}>▴</button>
            </div>
          </div>
        </div>
      )}

      {tab === "preview" && <Preview steps={steps} tourTitle={tourTitle}/>}
      {tab === "settings" && <Settings langs={langs} setLangs={setLangs} toast={toast}/>}

      {toastMsg && <div className="toast">{toastMsg}</div>}
      </main>
    </div>
  );
}

  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" style={{flexShrink:0}}>
      <path d="M6 26 V12 L13 7 V26 M13 7 L19 4 V26 M19 10 L26 13 V26 M3 26 H29"
            stroke="#0D184C" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" fill="none"/>
      <path d="M9.5 16 h1.5 M9.5 20 h1.5 M15.5 12 h1.5 M15.5 16 h1.5 M15.5 20 h1.5 M22 16 h1.5 M22 20 h1.5"
            stroke="#0D184C" strokeWidth="1.6" strokeLinecap="round"/>

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
